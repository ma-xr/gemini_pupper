# sit_stay_shake: fetched with get_trick.py (W&B ma-xr-stanford-university/mjlab/a8gunkbe).
description: >-
  Sits down like a dog and STAYS sitting until asked to do something else. While sitting,
  it can shake its left or right paw (a handshake), then keeps sitting. Starts standing.
  Use this for "sit", "sit and stay", or "shake my hand" (play this first, then the shake).
type: policy
policy: policy.json
start_pose: standing
end_pose: sitting
max_body_angle_deg: 60   # the sit leans back about 35 degrees
actions:
  shake_left: Lifts and shakes its LEFT front paw like a handshake, then keeps sitting.
  shake_right: Lifts and shakes its RIGHT front paw like a handshake, then keeps sitting.
  stand_up: Stands back up from sitting and leaves the trick, ready to walk.
exit_clip: stand_up
